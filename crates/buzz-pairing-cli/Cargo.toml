[package]
name = "buzz-pairing-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI tool for NIP-AB device pairing interop testing"

[[bin]]
name = "buzz-pair"
path = "src/main.rs"

[dependencies]
buzz-core = { workspace = true }
nostr = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
hex = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
thiserror = { workspace = true }
zeroize = { workspace = true }

# Explicit rustls dep with the ring provider — required to install the
# process-level CryptoProvider at startup. Without this the `buzz-pair` binary
# panics on any wss:// connect when a scoped build (or a multi-package build)
# leaves rustls unable to auto-select a provider (both ring and aws-lc-rs are
# enabled transitively). Same pattern as buzz-cli / buzz-relay / buzz-acp.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
