name: Patched build (fork)

# Builds the mention-gate-relax patch for Windows (NSIS) and macOS arm64
# (.app + .dmg) and publishes both as assets on a GitHub Release in this fork.
# Unsigned: both platforms will warn on first launch.

on:
  push:
    tags: ['patched-v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows x86_64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Add Rust target
        shell: bash
        run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          shared-key: patched-windows-release
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Generate non-updating bundle config
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.canary.conf.json <<'JSON'
          { "bundle": { "createUpdaterArtifacts": false } }
          JSON
      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"
      - name: Build NSIS installer (unsigned)
        shell: bash
        run: cd desktop && pnpm tauri build --target "$TARGET" --bundles nsis --config src-tauri/tauri.canary.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find "desktop/src-tauri/target/${TARGET}/release/bundle/nsis" -name '*.exe' -type f -exec cp {} out/ \;
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: out/*.exe
          if-no-files-found: error

  macos:
    name: macOS arm64 (.app + .dmg)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Add Rust target
        shell: bash
        run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          shared-key: patched-macos-release
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Generate non-updating bundle config
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.canary.conf.json <<'JSON'
          { "bundle": { "createUpdaterArtifacts": false } }
          JSON
      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"
      - name: Build app bundle (unsigned)
        shell: bash
        run: cd desktop && pnpm tauri build --no-sign --target "$TARGET" --bundles app,dmg --config src-tauri/tauri.canary.conf.json
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="desktop/src-tauri/target/${TARGET}/release/bundle"
          mkdir -p out
          find "$BUNDLE/dmg" -name '*.dmg' -type f -exec cp {} out/ \; || true
          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE/macos/Buzz.app" "out/Buzz-macos-arm64.app.zip"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten
        run: |
          set -euo pipefail
          mkdir -p upload && find dist -type f -exec cp {} upload/ \;
          ls -l upload
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Buzz 0.5.0 + cross-machine agent mentions ($TAG)" \
            --notes "Unsigned builds of Buzz Desktop v0.5.0 with the managed-agent \
          @-mention gate reverted, so agents hosted on another machine are mentionable.

          Upstream issue: https://github.com/block/buzz/issues/3277
          Patch: two files, reverting a4dfead2 (#2149).

          - Windows: NSIS installer, unsigned — SmartScreen will warn.
          - macOS arm64: .dmg and zipped .app, ad-hoc signed — expect Keychain
            re-prompts, since ACLs were bound to Block's Developer ID signature.
          - Neither build has an auto-updater."
